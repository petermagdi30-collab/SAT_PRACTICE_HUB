<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital SAT Math Practice Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Base Typography & Bluebook Academic Palette */
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }

    /* Clean HTML/CSS Math Formatting */
    .math {
      font-family: 'Cambria Math', 'Times New Roman', Georgia, serif;
      font-size: 1.08em;
      letter-spacing: 0.01em;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 0.18em;
      font-size: 0.92em;
      line-height: 1.1;
    }
    .frac > span:first-child {
      border-bottom: 1.5px solid currentColor;
      padding: 0 0.22em 0.08em;
    }
    .frac > span:last-child {
      padding: 0.1em 0.22em 0;
    }
    .sqrt {
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }
    .sqrt-rad {
      font-size: 1.15em;
      line-height: 1;
      margin-right: 0.04em;
    }
    .sqrt-body {
      border-top: 1.5px solid currentColor;
      padding: 0.05em 0.18em 0;
      line-height: 1.15;
    }
    .sup-root {
      font-size: 0.68em;
      vertical-align: super;
      margin-right: -0.25em;
    }

    /* Strikethrough for Eliminated Choices */
    .choice-eliminated {
      opacity: 0.45;
      text-decoration: line-through;
      background-color: #F1F5F9 !important;
    }

    /* Draggable & Resizable Desmos Floating Window */
    #desmos-panel {
      position: fixed;
      top: 72px;
      right: 20px;
      width: 440px;
      height: 520px;
      min-width: 300px;
      min-height: 320px;
      max-width: 96vw;
      max-height: 88vh;
      resize: both;
      overflow: hidden;
      z-index: 60;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.28);
    }
    @media (max-width: 640px) {
      #desmos-panel {
        left: 2vw;
        right: 2vw;
        width: 96vw;
        height: 65vh;
        resize: none;
      }
    }

    /* Smooth reveal animation */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-reveal {
      animation: fadeSlideIn 0.22s ease-out forwards;
    }

    /* Clean Data Tables inside Questions */
    .sat-table {
      border-collapse: collapse;
      margin: 0.75rem auto;
      font-size: 0.92rem;
      background: #FFFFFF;
    }
    .sat-table th, .sat-table td {
      border: 1px solid #CBD5E1;
      padding: 0.45rem 0.9rem;
      text-align: center;
    }
    .sat-table th {
      background-color: #F1F5F9;
      font-weight: 600;
      color: #0F172A;
    }

    /* Print / Save PDF Stylesheet */
    @media print {
      body {
        background: #FFFFFF !important;
        color: #000000 !important;
      }
      .no-print, #top-bar, #desmos-panel, #toast-container, #modal-backdrop {
        display: none !important;
      }
      #app-main {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .print-card {
        box-shadow: none !important;
        border: 1px solid #CBD5E1 !important;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ==================== TOP NAVIGATION BAR ==================== -->

          SAT

            <button onclick="resetTimer()" title="Reset Timer" class="text-slate-400 hover:text-slate-700 px-1 text-xs">&#x21BA;</button>

        </div>

          <span class="hidden md:inline">Desmos</span>
        </button>

          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span class="hidden sm:inline">Score Report</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT CONTAINER ==================== -->
  <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-6">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="border-t border-slate-200 bg-white py-4 px-4 text-xs text-slate-500 no-print">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div>Digital SAT Math Practice Hub &bull; Bluebook-Inspired Self-Study & Classroom Platform</div>
      <div class="flex items-center gap-4">
        <button onclick="openImportModal()" class="text-blue-700 hover:underline font-medium">Manage / Import Questions</button>
        <button onclick="openResetModal()" class="text-rose-600 hover:underline font-medium">Reset Progress</button>

  <!-- ==================== FLOATING DRAGGABLE DESMOS CALCULATOR ==================== -->
  <div id="desmos-panel" class="hidden rounded-2xl bg-white border border-slate-300 flex flex-col">
    <div id="desmos-header" class="bg-slate-900 text-white px-3.5 py-2.5 flex items-center justify-between cursor-move select-none rounded-t-2xl">
      <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span>Desmos Graphing Calculator (SAT Mode)</span>
      </div>

      </div>
    </div>
    <div class="relative flex-1 bg-slate-50">

      <div class="absolute bottom-1.5 left-2 right-2 pointer-events-none flex justify-between items-center text-[10px] text-slate-400">
        <span>Drag header to move &bull; Drag corner to resize</span>
      </div>

        <h2 id="modal-title" class="text-lg font-bold text-slate-900">Modal</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-1">&times;</button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto text-sm text-slate-700"></div>
    </div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
        const rawCustom = localStorage.getItem(CUSTOM_Q_KEY);
        if (rawCustom) {
          customQuestions = JSON.parse(rawCustom);
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      document.getElementById('student-name-label').textContent = state.studentName || 'Student';
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    function getAllQuestions() {
      return [...DEFAULT_QUESTIONS, ...customQuestions];
    }

    /* =========================================================================
       5. SAFE NUMERIC / FRACTION PARSER FOR SPR QUESTIONS
    ========================================================================= */
    function parseNumericInput(raw) {
      if (typeof raw !== 'string') return NaN;
      const cleaned = raw.trim().replace(/,/g, '').replace(/\s+/g, '');
      if (!cleaned) return NaN;
      // Exact fraction form: optional minus, digits/decimal, slash, digits/decimal
      if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(cleaned)) {
        const [num, den] = cleaned.split('/').map(Number);
        if (den === 0 || isNaN(num) || isNaN(den)) return NaN;
        return num / den;
      }
      if (/^-?\d*\.?\d+$/.test(cleaned)) {
        return Number(cleaned);
      }
      return NaN;
    }

    function checkSPRAnswer(q, rawInput) {
      const cleaned = rawInput.trim().replace(/,/g, '').replace(/\s+/g, '');
      if (!cleaned) return false;
      if (Array.isArray(q.accept)) {
        for (const acc of q.accept) {
          if (cleaned.toLowerCase() === String(acc).trim().toLowerCase()) return true;
        }
      }
      const parsed = parseNumericInput(cleaned);
      if (isNaN(parsed)) return false;
      const target = typeof q.answer === 'number' ? q.answer : parseNumericInput(String(q.answer));
      if (isNaN(target)) return false;
      return Math.abs(parsed - target) < 0.005;
    }

    /* =========================================================================
       6. STATS COMPUTATION HELPERS
    ========================================================================= */
    function getStatsForList(list) {
      let answered = 0, correct = 0;
      for (const q of list) {
        const rec = state.answers[q.id];
        if (rec) {
          answered++;
          if (rec.isCorrect) correct++;
        }
      }
      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : null;
      return { total: list.length, answered, correct, accuracy };
    }

    function startSession(domainId, levelId, customList = null, customTitle = null) {
      const allQ = getAllQuestions();
      let list = customList;
      if (!list) {
        list = allQ.filter(q => (domainId === 'all' || q.domain === domainId) && (levelId === 'all' || q.level === levelId));
      }
      if (!list.length) {
        showToast('No questions found for this selection.', 'rose');
        return;
      }

      const domObj = DOMAINS.find(d => d.id === domainId);
      const lvlObj = LEVELS.find(l => l.id === levelId);

      session = {
        title: customTitle || `${domObj ? domObj.name : 'All Domains'} — ${lvlObj ? lvlObj.label : 'All Levels'}`,
        domainId,
        levelId,
        questions: list,
        index: 0,
        eliminateMode: false,
        showHint: false,
        navOpen: false,
        isRetryMissed: !!customList
      };
      currentView = 'practice';
      renderPractice();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPractice() {
      const q = session.questions[session.index];
      const domObj = DOMAINS.find(d => d.id === q.domain);
      const lvlObj = LEVELS.find(l => l.id === q.level) || LEVELS[0];
      const rec = state.answers[q.id];
      const isFlagged = !!state.flagged[q.id];
      const elimList = state.eliminated[q.id] || [];
      const letters = ['A', 'B', 'C', 'D'];

      // Build Choice / Input UI
      let inputHtml = '';
      if (q.type === 'mc') {
        inputHtml = `
          <div class="space-y-2.5 mt-5" id="mc-options">
            ${q.choices.map((choiceHtml, idx) => {
              const isElim = elimList.includes(idx);
              const isSelected = rec && rec.userAnswer === idx;
              const isCorrectChoice = idx === q.answer;

              let borderClass = 'border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50/40';
              let badgeClass = 'bg-slate-100 text-slate-700 border-slate-300';

              if (rec) {
                if (isCorrectChoice) {
                  borderClass = 'border-emerald-500 bg-emerald-50/80 ring-1 ring-emerald-500';
                  badgeClass = 'bg-emerald-600 text-white border-emerald-600';
                } else if (isSelected && !rec.isCorrect) {
                  borderClass = 'border-rose-500 bg-rose-50/80 ring-1 ring-rose-500';
                  badgeClass = 'bg-rose-600 text-white border-rose-600';
                } else {
                  borderClass = 'border-slate-200 bg-white opacity-75';
                }
              } else if (session.pendingChoice === idx) {
                borderClass = 'border-blue-600 bg-blue-50 ring-2 ring-blue-600/20';
                badgeClass = 'bg-blue-700 text-white border-blue-700';
              }

              return `
                <div class="flex items-center gap-2">
                  <button type="button" ${rec ? 'disabled' : `onclick="selectMC(${idx})"`}
                    class="flex-1 flex items-center gap-3.5 p-3.5 rounded-xl border text-left transition ${borderClass} ${isElim && !rec ? 'choice-eliminated' : ''} ${rec ? 'cursor-default' : 'cursor-pointer'}">
                    <span class="w-8 h-8 rounded-full border flex items-center justify-center font-bold text-sm shrink-0 ${badgeClass}">
                      ${letters[idx]}
                    </span>
                    <span class="text-sm sm:text-base text-slate-800 leading-snug">${choiceHtml}</span>
                  </button>
                  ${session.eliminateMode && !rec ? `
                    <button type="button" onclick="toggleEliminate(${idx})" title="Cross out choice ${letters[idx]}"
                      class="w-9 h-9 rounded-lg border ${isElim ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-300 hover:bg-slate-100'} flex items-center justify-center font-bold text-xs shrink-0 transition">
                      &times;
                    </button>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        // Student-Produced Response (SPR)
        const val = rec ? rec.userAnswer : (session.pendingSPR || '');
        let inputBorder = 'border-slate-300 focus:border-blue-600 focus:ring-blue-600/20';
        if (rec) {
          inputBorder = rec.isCorrect
            ? 'border-emerald-500 bg-emerald-50 text-emerald-900'
            : 'border-rose-500 bg-rose-50 text-rose-900';
        }
        inputHtml = `
          <div class="mt-5 p-4 rounded-xl bg-slate-50 border border-slate-200">
            <label for="spr-input" class="block text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">
              Student-Produced Response (Enter a number or fraction like 3/4 or 1.5)
            </label>
            <div class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center">
              <input id="spr-input" type="text" autocomplete="off" ${rec ? 'disabled' : ''}
                value="${escapeHtml(String(val))}"
                oninput="updatePendingSPR(this.value)"
                placeholder="Type your answer..."
                class="flex-1 max-w-xs px-4 py-3 rounded-xl border-2 font-mono text-lg font-semibold bg-white focus:outline-none focus:ring-4 transition ${inputBorder}" />
              <div id="spr-preview" class="text-xs text-slate-500 font-medium">
                ${!rec && val ? formatSPRPreview(val) : ''}
              </div>
            </div>
          </div>
        `;
      }

      // Feedback Panel
      let feedbackHtml = '';
      if (rec) {
        const correctDisplay = q.type === 'mc'
          ? `${letters[q.answer]} (${q.choices[q.answer]})`
          : (q.accept ? q.accept[0] : q.answer);
        const userDisplay = q.type === 'mc'
          ? letters[rec.userAnswer]
          : escapeHtml(String(rec.userAnswer));

        feedbackHtml = `
          <div class="mt-6 rounded-2xl border ${rec.isCorrect ? 'border-emerald-300 bg-emerald-50/70' : 'border-rose-300 bg-rose-50/70'} p-5 animate-reveal space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold ${rec.isCorrect ? 'bg-emerald-600' : 'bg-rose-600'}">
                  ${rec.isCorrect ? '&#10003;' : '&#10007;'}
                </span>
                <div>
                  <div class="font-bold text-base ${rec.isCorrect ? 'text-emerald-900' : 'text-rose-900'}">
                    ${rec.isCorrect ? 'Correct! Great work.' : 'Not quite — review the solution below.'}
                  </div>
                  <div class="text-xs text-slate-600">
                    Your Answer: <strong class="text-slate-900">${userDisplay}</strong> &bull;
                    Correct Answer: <strong class="text-emerald-800">${correctDisplay}</strong>
                  </div>
                </div>
              </div>
              <button onclick="clearQuestionAnswer('${q.id}')" class="text-xs font-semibold text-slate-500 hover:text-slate-800 underline">
                Try Again
              </button>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-4">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Step-by-Step Solution</div>
              <div class="text-sm text-slate-800 leading-relaxed">${q.solution}</div>
            </div>

            ${q.desmos ? `
              <div class="bg-blue-50/80 rounded-xl border border-blue-200 p-3.5 flex items-start gap-2.5">
                <span class="px-2 py-0.5 rounded bg-blue-700 text-white text-[10px] font-bold uppercase tracking-wide shrink-0 mt-0.5">Desmos Tip</span>
                <div class="text-xs sm:text-sm text-blue-950 leading-snug">${q.desmos}</div>
              </div>
            ` : ''}
          </div>
        `;
      }

      // Navigator Popover Grid
      const navGridHtml = session.navOpen ? `
        <div class="absolute bottom-16 left-1/2 -translate-x-1/2 w-[310px] sm:w-[380px] bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 z-30 animate-reveal">
          <div class="flex items-center justify-between mb-3">
            <span class="font-bold text-sm text-slate-900">Question Navigator</span>
            <button onclick="toggleNavPopover()" class="text-slate-400 hover:text-slate-700 text-lg leading-none">&times;</button>
          </div>
          <div class="grid grid-cols-6 gap-2 mb-3">
            ${session.questions.map((item, i) => {
              const r = state.answers[item.id];
              const fl = state.flagged[item.id];
              let cls = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
              if (r && r.isCorrect) cls = 'bg-emerald-100 text-emerald-800 border-emerald-300';
              else if (r && !r.isCorrect) cls = 'bg-rose-100 text-rose-800 border-rose-300';
              if (i === session.index) cls += ' ring-2 ring-blue-600 font-extrabold';
              return `
                <button onclick="jumpToIndex(${i})" class="relative h-9 rounded-lg border text-xs font-semibold transition ${cls}">
                  ${i + 1}
                  ${fl ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-500 border border-white"></span>' : ''}
                </button>
              `;
            }).join('')}
          </div>
          <div class="flex flex-wrap items-center justify-center gap-3 text-[11px] text-slate-500 border-t border-slate-100 pt-2.5">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-200 border border-emerald-400"></span>Correct</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-rose-200 border border-rose-400"></span>Incorrect</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Flagged</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-slate-200"></span>Unanswered</span>
          </div>
        </div>
      ` : '';

      const canCheck = !rec && (
        (q.type === 'mc' && session.pendingChoice !== undefined && session.pendingChoice !== null) ||
        (q.type === 'spr' && session.pendingSPR && session.pendingSPR.trim().length > 0)
      );

      document.getElementById('app-main').innerHTML = `
        <div class="max-w-3xl mx-auto animate-reveal pb-16">
          <!-- Practice Top Strip -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs px-4 py-3 mb-4 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2 flex-wrap">
              <button onclick="navigateHome()" class="text-xs font-semibold text-slate-500 hover:text-blue-700 flex items-center gap-1 pr-2 border-r border-slate-200">
                &larr; Hub
              </button>
              <span class="font-bold text-xs sm:text-sm text-slate-900">${domObj ? domObj.short : 'Practice'}</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border ${lvlObj.badge}">${lvlObj.label}</span>
              <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 text-[11px] font-medium">${q.skill}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-500 mr-1">Q ${session.index + 1} of ${session.questions.length}</span>
              <button onclick="toggleFlag('${q.id}')"
                class="px-2.5 py-1 rounded-lg border text-xs font-semibold transition flex items-center gap-1 ${isFlagged ? 'bg-amber-100 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                <span>&#9873;</span><span class="hidden sm:inline">${isFlagged ? 'Flagged' : 'Flag'}</span>
              </button>
              ${q.type === 'mc' ? `
                <button onclick="toggleEliminateMode()"
                  class="px-2.5 py-1 rounded-lg border text-xs font-semibold transition ${session.eliminateMode ? 'bg-slate-900 text-white border-slate-900' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                  <span class="line-through">ABC</span>
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Question Card -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7">
            <div class="flex items-center justify-between mb-3">
              <span class="inline-flex items-center justify-center px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold">
                Question ${session.index + 1}
              </span>
              <span class="text-[11px] text-slate-400 font-medium">
                ${q.type === 'mc' ? 'Multiple Choice (Keys A–D / 1–4)' : 'Student-Produced Response'}
              </span>
            </div>

            ${q.visual ? `<div class="my-3 overflow-x-auto">${q.visual}</div>` : ''}

            <div class="text-base sm:text-[17px] text-slate-900 leading-relaxed font-normal">
              ${q.prompt}
            </div>

            ${inputHtml}

            <!-- Hint Area -->
            ${!rec && session.showHint && q.hint ? `
              <div class="mt-4 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs sm:text-sm text-amber-950 animate-reveal">
                <strong>Hint:</strong> ${q.hint}
              </div>
            ` : ''}

            <!-- Action Buttons -->
            <div class="mt-6 flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100">
              <div>
                ${!rec && q.hint ? `
                  <button onclick="toggleHint()" class="px-3.5 py-2 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs sm:text-sm font-semibold transition">
                    ${session.showHint ? 'Hide Hint' : 'Show Hint'}
                  </button>
                ` : ''}
              </div>
              <div class="flex items-center gap-2.5">
                ${!rec ? `
                  <button id="check-answer-btn" onclick="submitCurrentAnswer()" ${canCheck ? '' : 'disabled'}
                    class="px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition ${canCheck ? 'bg-blue-700 hover:bg-blue-800 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                    Check Answer
                  </button>
                ` : `
                  ${session.index < session.questions.length - 1 ? `
                    <button onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm shadow-sm transition">
                      Next Question &rarr;
                    </button>
                  ` : `
                    <button onclick="openDashboard(true)" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-sm transition">
                      Finish &amp; View Report &rarr;
                    </button>
                  `}
                `}
              </div>
            </div>

            ${feedbackHtml}
          </div>

          <!-- Bottom Bar -->
          <div class="relative mt-5 bg-white rounded-2xl border border-slate-200 shadow-xs px-4 py-3 flex items-center justify-between gap-2">
            <button onclick="prevQuestion()" ${session.index === 0 ? 'disabled' : ''}
              class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs sm:text-sm font-semibold transition ${session.index === 0 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-700 hover:bg-slate-100'}">
              &larr; Previous
            </button>

            <button onclick="toggleNavPopover()"
              class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold transition flex items-center gap-1.5">
              <span>Question ${session.index + 1} of ${session.questions.length}</span>
              <span class="text-[10px]">&#9650;</span>
            </button>

            <div class="flex items-center gap-2">
              ${session.index < session.questions.length - 1 ? `
                <button onclick="nextQuestion()" class="px-3.5 py-2 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-xs sm:text-sm font-semibold transition">
                  Next &rarr;
                </button>
              ` : `
                <button onclick="openDashboard(true)" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold transition">
                  Finish
                </button>
              `}
            </div>

            ${navGridHtml}
          </div>
        </div>
      `;

      // Focus SPR input automatically if unanswered
      if (q.type === 'spr' && !rec) {
        const inp = document.getElementById('spr-input');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);
        }
      }
    }

    function formatSPRPreview(val) {
      const p = parseNumericInput(val);
      if (!val.trim()) return '';
      if (isNaN(p)) return '<span class="text-rose-600">Enter a valid number or fraction</span>';
      return `<span class="text-slate-600">Parsed value: <strong>${Number(p.toFixed(4))}</strong></span>`;
    }

    function selectMC(idx) {
      session.pendingChoice = idx;
      renderPractice();
    }

    function updatePendingSPR(val) {
      session.pendingSPR = val;
      const preview = document.getElementById('spr-preview');
      if (preview) preview.innerHTML = formatSPRPreview(val);
      const btn = document.getElementById('check-answer-btn');
      if (btn) {
        const ok = val.trim().length > 0;
        btn.disabled = !ok;
        btn.className = ok
          ? 'px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition bg-blue-700 hover:bg-blue-800 text-white cursor-pointer'
          : 'px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition bg-slate-200 text-slate-400 cursor-not-allowed';
      }
    }

    function submitCurrentAnswer() {
      const q = session.questions[session.index];
      if (state.answers[q.id]) return;

      let userAnswer, isCorrect;
      if (q.type === 'mc') {
        if (session.pendingChoice === undefined || session.pendingChoice === null) return;
        userAnswer = session.pendingChoice;
        isCorrect = userAnswer === q.answer;
      } else {
        const raw = (session.pendingSPR || '').trim();
        if (!raw) return;
        userAnswer = raw;
        isCorrect = checkSPRAnswer(q, raw);
      }

      state.answers[q.id] = { userAnswer, isCorrect, timestamp: Date.now() };
      saveState();
      session.pendingChoice = null;
      session.pendingSPR = '';
      session.showHint = false;
      renderPractice();
    }

    function clearQuestionAnswer(qId) {
      delete state.answers[qId];
      saveState();
      session.pendingChoice = null;
      session.pendingSPR = '';
      renderPractice();
    }

    function toggleFlag(qId) {
      if (state.flagged[qId]) delete state.flagged[qId];
      else state.flagged[qId] = true;
      saveState();
      renderPractice();
    }

    function toggleEliminateMode() {
      session.eliminateMode = !session.eliminateMode;
      renderPractice();
    }

    function toggleEliminate(idx) {
      const qId = session.questions[session.index].id;
      const list = state.eliminated[qId] || [];
      if (list.includes(idx)) {
        state.eliminated[qId] = list.filter(i => i !== idx);
      } else {
        state.eliminated[qId] = [...list, idx];
      }
      saveState();
      renderPractice();
    }

    function toggleHint() {
      session.showHint = !session.showHint;
      renderPractice();
    }

    function toggleNavPopover() {
      session.navOpen = !session.navOpen;
      renderPractice();
    }

    function jumpToIndex(i) {
      session.index = i;
      session.pendingChoice = null;
      session.pendingSPR = '';
      session.showHint = false;
      session.navOpen = false;
      renderPractice();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevQuestion() {
      if (session.index > 0) jumpToIndex(session.index - 1);
    }

    function nextQuestion() {
      if (session.index < session.questions.length - 1) jumpToIndex(session.index + 1);
    }

    /* =========================================================================
       9. SUMMARY & SCORE REPORT DASHBOARD
    ========================================================================= */
    function openDashboard(fromSession = false) {
      currentView = 'dashboard';
      renderDashboard(fromSession);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDashboard(fromSession) {
      const allQ = getAllQuestions();
      const overall = getStatsForList(allQ);
      const hasSession = fromSession && session.questions.length > 0;
      const activeList = hasSession ? session.questions : allQ;
      const activeStats = getStatsForList(activeList);

      const missedList = activeList.filter(q => state.answers[q.id] && !state.answers[q.id].isCorrect);
      const allMissed = allQ.filter(q => state.answers[q.id] && !state.answers[q.id].isCorrect);
      const letters = ['A', 'B', 'C', 'D'];

      // Domain x Level Matrix Rows
      const matrixRows = DOMAINS.map(d => {
        const domQs = allQ.filter(q => q.domain === d.id);
        const ds = getStatsForList(domQs);
        const cells = LEVELS.map(lvl => {
          const lq = domQs.filter(q => q.level === lvl.id);
          const ls = getStatsForList(lq);
          const accText = ls.accuracy !== null ? `${ls.accuracy}%` : '—';
          return `
            <td class="px-3 py-3 text-center">
              <button onclick="startSession('${d.id}', '${lvl.id}')" class="inline-flex flex-col items-center px-2.5 py-1 rounded-lg hover:bg-slate-100 transition">
                <span class="font-bold text-slate-900 text-xs sm:text-sm">${ls.correct}/${ls.total}</span>
                <span class="text-[11px] ${ls.accuracy === null ? 'text-slate-400' : ls.accuracy >= 80 ? 'text-emerald-600 font-semibold' : ls.accuracy >= 50 ? 'text-amber-600 font-semibold' : 'text-rose-600 font-semibold'}">${accText}</span>
              </button>
            </td>
          `;
        }).join('');
        return `
          <tr class="border-t border-slate-100">
            <td class="px-4 py-3 font-semibold text-slate-900 text-xs sm:text-sm">${d.name}</td>
            ${cells}
            <td class="px-3 py-3 text-center font-bold text-xs sm:text-sm text-blue-700">${ds.correct}/${ds.total} (${ds.accuracy !== null ? ds.accuracy + '%' : '—'})</td>
          </tr>
        `;
      }).join('');

      // Missed Questions List
      const missedHtml = missedList.length === 0
        ? `<div class="p-6 text-center text-sm text-slate-500">No missed questions in this view! ${activeStats.answered === 0 ? 'Start practicing from the Domain Hub to track your progress.' : 'Excellent accuracy!'}</div>`
        : `<div class="divide-y divide-slate-100">
            ${missedList.map(q => {
              const dom = DOMAINS.find(d => d.id === q.domain);
              const lvl = LEVELS.find(l => l.id === q.level);
              const rec = state.answers[q.id];
              const uAns = q.type === 'mc' ? letters[rec.userAnswer] : rec.userAnswer;
              const cAns = q.type === 'mc' ? letters[q.answer] : (q.accept ? q.accept[0] : q.answer);
              return `
                <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="font-bold text-xs text-slate-900">${dom ? dom.short : ''}</span>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${lvl ? lvl.badge : ''}">${lvl ? lvl.label : ''}</span>
                      <span class="text-xs text-slate-500">${q.skill}</span>
                    </div>
                    <div class="text-xs text-slate-600">
                      Your answer: <strong class="text-rose-600">${escapeHtml(String(uAns))}</strong> &bull;
                      Correct: <strong class="text-emerald-700">${escapeHtml(String(cAns))}</strong>
                    </div>
                  </div>
                  <button onclick="jumpToQuestionById('${q.id}')"
                    class="no-print self-start sm:self-center px-3 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition shrink-0">
                    Jump &rarr;
                  </button>
                </div>
              `;
            }).join('')}
          </div>`;

      document.getElementById('app-main').innerHTML = `
        <div class="max-w-5xl mx-auto space-y-6 animate-reveal">
          <!-- Header & Export Actions -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 sm:p-6 print-card">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-blue-700 mb-1">Performance Report</div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">
                  ${hasSession ? session.title : 'Overall Digital SAT Math Dashboard'}

    function jumpToQuestionById(qId) {
      const allQ = getAllQuestions();
      const target = allQ.find(q => q.id === qId);
      if (!target) return;
      const list = allQ.filter(q => q.domain === target.domain && q.level === target.level);
      const idx = list.findIndex(q => q.id === qId);
      startSession(target.domain, target.level);
      if (idx >= 0) jumpToIndex(idx);
    }

    function retryMissedOnly(fromSession) {
      const allQ = getAllQuestions();
      const pool = fromSession && session.questions.length ? session.questions : allQ;
      const missed = pool.filter(q => state.answers[q.id] && !state.answers[q.id].isCorrect);
      const list = missed.length ? missed : allQ.filter(q => state.answers[q.id] && !state.answers[q.id].isCorrect);
      if (!list.length) {
        showToast('No missed questions to retry!', 'emerald');
        return;
      }
      // Clear previous wrong answers on these items so student can re-attempt cleanly
      list.forEach(q => { delete state.answers[q.id]; });
      saveState();
      startSession('all', 'all', list, 'Retry Missed Questions');
    }

    function buildReportText(fromSession) {
      const allQ = getAllQuestions();
      const hasSession = fromSession && session.questions.length > 0;
      const activeList = hasSession ? session.questions : allQ;
      const s = getStatsForList(activeList);
      const overall = getStatsForList(allQ);
      const missed = activeList.filter(q => state.answers[q.id] && !state.answers[q.id].isCorrect);
      const letters = ['A', 'B', 'C', 'D'];

      let lines = [
        '============================================',
        'DIGITAL SAT MATH PRACTICE HUB - SCORE REPORT',
        '============================================',
        `Student Name: ${state.studentName || 'Student'}`,
        `Date: ${new Date().toLocaleString()}`,
        `Section: ${hasSession ? session.title : 'All 4 Official Domains'}`,
        `Score: ${s.correct} / ${s.total} (${s.answered} answered)`,
        `Accuracy: ${s.accuracy !== null ? s.accuracy + '%' : 'N/A'}`,
        '',
        '--- DOMAIN BREAKDOWN (OVERALL) ---'
      ];

      DOMAINS.forEach(d => {
        const dq = allQ.filter(q => q.domain === d.id);
        const ds = getStatsForList(dq);
        const lvlParts = LEVELS.map(l => {
          const ls = getStatsForList(dq.filter(q => q.level === l.id));
          return `${l.label}: ${ls.correct}/${ls.total}`;
        }).join(' | ');
        lines.push(`${d.name}: ${ds.correct}/${ds.total} (${ds.accuracy !== null ? ds.accuracy + '%' : '—'}) [${lvlParts}]`);
      });

      lines.push('');
      lines.push(`--- MISSED QUESTIONS (${missed.length}) ---`);
      if (!missed.length) {
        lines.push('None!');
      } else {
        missed.forEach((q, i) => {
          const rec = state.answers[q.id];
          const uAns = q.type === 'mc' ? letters[rec.userAnswer] : rec.userAnswer;
          const cAns = q.type === 'mc' ? letters[q.answer] : (q.accept ? q.accept[0] : q.answer);
          lines.push(`${i + 1}. [${q.domain.toUpperCase()} - ${q.level.toUpperCase()}] ${q.skill} | Your Ans: ${uAns} | Correct: ${cAns}`);
        });
      }
      lines.push('============================================');
      return lines.join('\n');
    }

    function copyScoreReport(fromSession) {
      const text = buildReportText(fromSession);
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Score report copied to clipboard!', 'emerald');
      } catch (err) {
        showToast('Copy failed — use Download (.txt) instead.', 'rose');
      }
      document.body.removeChild(ta);
    }

    function downloadScoreReport(fromSession) {
      const text = buildReportText(fromSession);
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeName = (state.studentName || 'Student').replace(/[^a-z0-9]/gi, '_');
      a.download = `SAT_Math_Report_${safeName}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Score report downloaded!', 'blue');
    }

            domain,
            level,
            skill: q.skill || 'Custom Skill',

            choices: q.choices || ['A', 'B', 'C', 'D'],

            accept: q.accept || [String(q.answer)],
            hint: q.hint || '',
            solution: q.solution || 'No solution provided.',

        customQuestions = [...customQuestions, ...valid];
        localStorage.setItem(CUSTOM_Q_KEY, JSON.stringify(customQuestions));

    // Make Desmos Floating Panel Draggable (Mouse & Touch)
    (function initDesmosDrag() {
      const panel = document.getElementById('desmos-panel');
      const header = document.getElementById('desmos-header');
      let dragging = false, offsetX = 0, offsetY = 0;

      function startDrag(clientX, clientY) {
        dragging = true;
        const rect = panel.getBoundingClientRect();
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        panel.style.right = 'auto';
        panel.style.left = rect.left + 'px';
        panel.style.top = rect.top + 'px';
        document.getElementById('desmos-iframe').style.pointerEvents = 'none';
      }

      function moveDrag(clientX, clientY) {
        if (!dragging) return;
        const x = Math.max(0, Math.min(window.innerWidth - 120, clientX - offsetX));
        const y = Math.max(0, Math.min(window.innerHeight - 60, clientY - offsetY));
        panel.style.left = x + 'px';
        panel.style.top = y + 'px';
      }

      function endDrag() {
        if (!dragging) return;
        dragging = false;
        document.getElementById('desmos-iframe').style.pointerEvents = 'auto';
      }

      header.addEventListener('mousedown', e => { if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') startDrag(e.clientX, e.clientY); });
      window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDrag);

      header.addEventListener('touchstart', e => {
        if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });
      window.addEventListener('touchmove', e => { if (dragging) moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      window.addEventListener('touchend', endDrag);
    })();

    // Keyboard Shortcuts for Practice Workspace
    document.addEventListener('keydown', e => {
      if (currentView !== 'practice') return;
      if (!document.getElementById('modal-backdrop').classList.contains('hidden')) return;
      const activeTag = document.activeElement?.tagName;
      const q = session.questions[session.index];
      const rec = state.answers[q.id];

      if (e.key === 'Enter') {
        if (!rec) {
          submitCurrentAnswer();
        } else if (session.index < session.questions.length - 1) {
          nextQuestion();
        }
        return;
      }

      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft') prevQuestion();
      else if (e.key === 'ArrowRight') nextQuestion();
      else if (q.type === 'mc' && !rec) {
        const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
        const idx = keyMap[e.key.toLowerCase()];
        if (idx !== undefined && idx < q.choices.length) selectMC(idx);
      }
    });

    function showToast(msg, color = 'blue') {
      const styles = {
        blue: 'bg-slate-900 text-white',
        emerald: 'bg-emerald-700 text-white',
        rose: 'bg-rose-700 text-white'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold animate-reveal ${styles[color] || styles.blue}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2600);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    /* =========================================================================
       12. INITIALIZE APP
    ========================================================================= */
    window.onload = function () {
      loadState();
      renderHome();
    };
  </script>
</body>
</html>
